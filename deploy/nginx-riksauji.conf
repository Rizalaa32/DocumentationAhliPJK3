# deploy/nginx-riksauji.conf
# Salin ke: /etc/nginx/sites-available/riksauji
# Ganti `domainanda.com` dengan nama domain Anda yang sebenarnya.

server {
    listen 80;
    listen [::]:80;
    server_name domainanda.com www.domainanda.com;

    # WAJIB: naikkan batas ukuran upload agar sinkronisasi banyak foto Base64 tidak kena Error 413
    client_max_body_size 50M;

    # Service Worker tidak boleh di-cache oleh browser maupun CDN Cloudflare
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Visitor $http_cf_visitor;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # Timeout longgar untuk proses kompresi Jimp + render PDF Puppeteer
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

